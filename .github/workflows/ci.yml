name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test dataset generation
        run: python -m booking_simulator --seed 42 --count 1000 --output build
