name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test dataset generation
        run: python -m booking_simulator --seed 42 --count 1000 --incidents --output build
      - name: Validate public prediction fixture
        run: python -m booking_simulator.predictions --predictions examples/predictions/submission.jsonl --events examples/predictions/events.jsonl
      - name: Smoke test public evaluation handoff
        run: python -m booking_simulator.evaluation_adapter --dataset examples/evaluation/dataset --reference examples/evaluation/reference --predictions examples/predictions/submission.jsonl --output build/public-evaluation-request.json
